name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          frontend=false
          python=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ||
                -z "${BASE_SHA}" ||
                "${BASE_SHA}" =~ ^0+$ ]]; then
            frontend=true
            python=true
          else
            while IFS= read -r path; do
              case "${path}" in
                .github/workflows/*|Dockerfile|.dockerignore)
                  frontend=true
                  python=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                docs/*|*.md|LICENSE)
                  ;;
                *)
                  python=true
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi

          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "python=${python}" >> "$GITHUB_OUTPUT"

  python:
    name: Python lint and tests
    needs:
      - changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Check formatting
        run: ruff format --check src/ tests/
      - name: Test
        run: pytest --tb=short -q -n 4 --dist loadscope

  frontend:
    name: Frontend checks
    needs:
      - changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify dependency sources
        run: npm run check:lockfile-sources
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build:ci
