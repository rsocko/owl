name: Publish container

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from the main branch history to publish
        required: true
        type: string
      version_mode:
        description: Resolve the next patch or use an explicit unused version
        required: true
        type: choice
        default: next_patch
        options:
          - next_patch
          - explicit
      image_tag:
        description: Unprefixed semantic version when version_mode=explicit
        required: false
        default: ""
        type: string
      push_latest:
        description: Also promote the image to latest
        required: true
        type: choice
        default: "true"
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify publication source
    if: >-
      github.event.repository.visibility == 'public' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Select and verify source commit
        id: source
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            source_sha="${AUTOMATIC_SHA}"
          else
            source_sha="${MANUAL_SHA}"
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publication requires a full lowercase commit SHA"
            exit 1
          fi
          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${source_sha}^{commit}"
          if ! git merge-base --is-ancestor "${source_sha}" "${trusted_main_sha}"; then
            echo "::error::Commit is not in the checked-out main history"
            exit 1
          fi
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, attest, and publish
    needs:
      - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/rsocko/owl
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out current main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Reverify main ancestry and select exact source
        shell: bash
        run: |
          set -euo pipefail
          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${trusted_main_sha}"; then
            echo "::error::Verified commit is no longer in main history"
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve immutable publication tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPLICIT_TAG: ${{ inputs.image_tag }}
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_REPOSITORY: ghcr.io/rsocko/owl
          REGISTRY_USERNAME: ${{ github.actor }}
          REQUESTED_MODE: ${{ inputs.version_mode }}
          REQUESTED_PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            export VERSION_MODE="next_patch"
            push_latest="true"
          else
            export VERSION_MODE="${REQUESTED_MODE}"
            push_latest="${REQUESTED_PUSH_LATEST}"
          fi
          python3 .github/scripts/resolve_registry_version.py
          echo "sha_tag=sha-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"

      - name: Reject immutable tag overwrite
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail
          require_absent() {
            local reference="$1"
            local output=""
            for attempt in 1 2 3; do
              if output="$(docker manifest inspect "${reference}" 2>&1)"; then
                echo "::error::Immutable image tag already exists: ${reference}"
                return 1
              fi
              if grep -Eqi 'manifest unknown|no such manifest|manifest.*not found' <<<"${output}"; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "::error::Could not prove immutable image tag is absent: ${reference}"
            return 1
          }
          require_absent "${IMAGE}:${VERSION_TAG}"
          require_absent "${IMAGE}:${SHA_TAG}"

      - name: Create isolated Buildx builder
        run: docker buildx create --driver docker-container --use

      - name: Build and publish digest-oriented image
        id: build
        env:
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/build-metadata.json"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "VCS_REF=${SOURCE_SHA}" \
            --build-arg "VERSION=${VERSION_TAG}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/rsocko/owl" \
            --attest type=sbom \
            --provenance=false \
            --metadata-file "${metadata_file}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/rsocko/owl
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote and verify requested tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSH_LATEST: ${{ steps.tags.outputs.push_latest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail
          require_absent() {
            local reference="$1"
            local output=""
            for attempt in 1 2 3; do
              if output="$(docker manifest inspect "${reference}" 2>&1)"; then
                echo "::error::Immutable image tag appeared before promotion: ${reference}"
                return 1
              fi
              if grep -Eqi 'manifest unknown|no such manifest|manifest.*not found' <<<"${output}"; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "::error::Could not prove immutable image tag is absent: ${reference}"
            return 1
          }
          version_ref="${IMAGE}:${VERSION_TAG}"
          sha_ref="${IMAGE}:${SHA_TAG}"
          require_absent "${version_ref}"
          require_absent "${sha_ref}"
          promotion_args=(--tag "${version_ref}" --tag "${sha_ref}")
          verification_refs=("${version_ref}" "${sha_ref}")
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            promotion_args+=(--tag "${IMAGE}:latest")
            verification_refs+=("${IMAGE}:latest")
          fi
          docker buildx imagetools create "${promotion_args[@]}" "${IMAGE}@${DIGEST}"
          for reference in "${verification_refs[@]}"; do
            promoted_digest="$(docker buildx imagetools inspect "${reference}" --format '{{.Manifest.Digest}}')"
            if [[ "${promoted_digest}" != "${DIGEST}" ]]; then
              echo "::error::${reference} resolved to ${promoted_digest}, expected ${DIGEST}"
              exit 1
            fi
          done

      - name: Publish image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          {
            echo "## OWL container"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
            echo "Version: \`${IMAGE}:${VERSION_TAG}\`"
            echo "Source: \`${IMAGE}:${SHA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
