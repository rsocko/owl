# Document Intelligence Hub — Homelab Deployment
# Managed via Dockhand stack pointing to rsocko/ideation repo
# Compose path: experiments/document-intelligence/docker-compose.yml
#
# Usage:
#   docker compose up -d --build             # Build and start all services
#   docker compose up -d --build statement-tracker  # Build and start just statement tracker
#   docker compose logs -f                   # Follow logs
#
# Build modes:
#   --build   → builds from local Dockerfile (dev/Dockhand stack)
#   no --build → pulls pre-built image from service-007.example.invalid (production)

services:
  # Statement Tracker — web dashboard + API for detecting missing statements
  statement-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-statement-tracker
    restart: unless-stopped
    command: ["serve", "--config", "/app/config/config.docker.yaml"]
    environment:
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${STATEMENT_TRACKER_PORT:-8071}:8001"
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence

  # EOB Matching — scheduled job to classify and match EOBs to bills
  # Runs on a schedule (via cron on host or Dockhand scheduled task)
  eob-matching:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-eob-matching
    restart: "no"
    entrypoint: ["eob-match"]
    command: ["run", "--limit", "200", "--verbose"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

  # Action Queue — scheduled pipeline for document triage/enrichment
  action-queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-action-queue
    restart: "no"
    entrypoint: ["paq"]
    command: ["run", "--dry-run", "--limit", "20"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-false}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

volumes:
  hub-data:
    name: doc-intelligence-data

networks:
  doc-intelligence:
    name: doc-intelligence
