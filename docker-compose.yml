# Document Intelligence Hub — Homelab Deployment
# Managed via Dockhand stack pointing to rsocko/ideation repo
# Compose path: experiments/document-intelligence/docker-compose.yml
#
# Usage:
#   docker compose up -d --build             # Build and start all services
#   docker compose up -d --build hub         # Build and start just the hub
#   docker compose logs -f                   # Follow logs
#
# Build modes:
#   --build   → builds from local Dockerfile (dev/Dockhand stack)
#   no --build → pulls pre-built image from service-007.example.invalid (production)

services:
  # Document Intelligence Hub — unified API with /admin, /statements, /api/*
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-hub
    restart: unless-stopped
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      STATEMENT_TRACKER_CONFIG: /app/config/config.docker.yaml
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-true}
      # LLM via Bifrost gateway
      LLM_BASE_URL: ${LLM_BASE_URL:-https://service-001.example.invalid/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-bifrost}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${STATEMENT_TRACKER_PORT:-8071}:8001"
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence

  # EOB Matching — scheduled job to classify and match EOBs to bills
  # Runs on a schedule (via cron on host or Dockhand scheduled task)
  eob-matching:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-eob-matching
    restart: "no"
    entrypoint: ["eob-match"]
    command: ["run", "--limit", "200", "--verbose"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://service-001.example.invalid/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-bifrost}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

  # Action Queue — scheduled pipeline for document triage/enrichment
  action-queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: doc-intelligence-action-queue
    restart: "no"
    entrypoint: ["paq"]
    command: ["run", "--limit", "20"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://service-001.example.invalid/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-bifrost}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-true}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

volumes:
  hub-data:
    name: doc-intelligence-data

networks:
  doc-intelligence:
    name: doc-intelligence
