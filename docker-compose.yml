# Document Intelligence Hub — local deployment
#
# Usage:
#   docker compose up -d --build             # Build and start all services
#   docker compose up -d --build hub         # Build and start just the hub
#   docker compose logs -f                   # Follow logs
#
services:
  # Document Intelligence Hub — unified API with /admin, /statements, /api/*
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-}"
        VCS_REF: "${VCS_REF:-}"
        VERSION: "${VERSION:-0.2.0}"
    image: ${DOC_HUB_IMAGE:-doc-intelligence-hub:local}
    container_name: doc-intelligence-hub
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      STATEMENT_TRACKER_CONFIG: /app/config/config.docker.yaml
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-true}
      # Local OpenAI-compatible endpoint; override all LLM_* values for hosted providers.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-development}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
      # Structured JSON logging for production
      LOG_FORMAT: ${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${STATEMENT_TRACKER_PORT:-8071}:8001"
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence

  # EOB Matching — scheduled job to classify and match EOBs to bills
  # Runs on a schedule (via cron on host or Dockhand scheduled task)
  eob-matching:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOC_HUB_IMAGE:-doc-intelligence-hub:local}
    container_name: doc-intelligence-eob-matching
    restart: "no"
    entrypoint: ["/docker-entrypoint.sh", "eob-match"]
    command: ["run", "--since-last-run", "--limit", "200", "--verbose"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-development}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

  # Action Queue — scheduled pipeline for document triage/enrichment
  action-queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOC_HUB_IMAGE:-doc-intelligence-hub:local}
    container_name: doc-intelligence-action-queue
    restart: "no"
    entrypoint: ["/docker-entrypoint.sh", "paq"]
    command: ["run", "--limit", "20"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-development}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-true}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - jobs

  # EOB Matching Scheduler — runs eob-matching on a daily cron schedule
  # Uses supercronic (lightweight cron for containers) to trigger the job.
  # Enabled via the 'scheduled' profile: docker compose --profile scheduled up -d
  eob-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOC_HUB_IMAGE:-doc-intelligence-hub:local}
    container_name: doc-intelligence-eob-scheduler
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["supercronic", "/app/config/crontab.eob-scheduler"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      WRITE_TO_PAPERLESS: ${WRITE_TO_PAPERLESS:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-development}
      LLM_MODEL: ${LLM_MODEL:-phi3:mini}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - hub-data:/app/data
    networks:
      - doc-intelligence
    profiles:
      - scheduled

volumes:
  hub-data:
    name: doc-intelligence-data

networks:
  doc-intelligence:
    name: doc-intelligence
