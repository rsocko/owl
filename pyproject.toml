[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence-hub"
version = "0.2.0"
description = "Document Intelligence Hub — unified Paperless-ngx document analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openai>=1.40.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0.0",
  "python-dateutil>=2.9.0",
  "uvicorn>=0.34.0",
  "pdfplumber>=0.11.0",
  "rapidfuzz>=3.0",
  "sqlalchemy>=2.0",
  "click>=8.0",
  "rich>=13.0",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
dashboard = [
  "streamlit>=1.30",
]

[project.scripts]
doc-hub = "doc_intelligence_hub.modules.statements.cli:main"
doc-hub-serve = "doc_intelligence_hub.api.app:main"
eob-match = "doc_intelligence_hub.modules.eob_matching.cli:cli"
paq = "doc_intelligence_hub.modules.action_queue.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doc_intelligence_hub" = [
  "modules/statements/static/*",
  "modules/statements/static/**/*",
  "api/static/*",
  "api/static/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",       # pycodestyle + pyflakes
  "I",                  # isort (import sorting)
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "BLE",                # flake8-blind-except
  "C4",                 # flake8-comprehensions
  "DTZ",                # flake8-datetimez
  "FURB",               # refurb
  "G",                  # flake8-logging-format
  "PERF",               # perflint
  "PL",                 # pylint
  "PYI",                # flake8-pyi
  "RUF",                # ruff-specific
  "S",                  # flake8-bandit (security)
  "SIM",                # flake8-simplify
  "TRY",                # tryceratops
]
ignore = [
  "BLE001",    # blind except — used intentionally for graceful degradation at startup
  "TRY003",    # long exception messages — acceptable in this codebase
  "S110",      # try-except-pass — used intentionally for optional features
  "PLR0913",   # too many arguments — common in data-heavy functions
  "PLR2004",   # magic values — too noisy for data processing code
  "PLC0415",   # import-outside-top-level — lazy/deferred imports are intentional (FastAPI, optional deps)
  "PLW0603",   # global-statement — established pattern in this codebase
  "PLR0911",   # too-many-return-statements — complex business logic
  "PLR0912",   # too-many-branches — complex business logic
  "PLR0915",   # too-many-statements — complex business logic
  "TRY300",    # try-consider-else — stylistic, not a bug
  "TRY301",    # raise-within-try — acceptable pattern
  "TRY400",    # error-instead-of-exception — existing logging pattern
  "S106",      # hardcoded-password-func-arg — false positives on config defaults
  "S104",      # hardcoded-bind-all-interfaces — intentional for container deployment
  "S105",      # hardcoded-password-string — false positives on config defaults
  "S608",      # hardcoded-sql-expression — SQLAlchemy text() usage is intentional
  "RUF001",    # ambiguous-unicode-character-string — false positives
  "RUF002",    # ambiguous-unicode-character-docstring — false positives
  "E501",      # line-too-long — handled by ruff format; check is redundant
  "DTZ011",    # call-date-today — date.today() is acceptable for date-only values
  "DTZ003",    # call-datetime-utcnow — migrating to datetime.now(UTC) is a separate effort
  "DTZ001",    # call-datetime-without-tzinfo — same as above
  "DTZ005",    # call-datetime-now-without-tzinfo — same as above
  "DTZ007",    # call-datetime-strptime-without-zone — same as above
  "UP042",     # replace-str-enum — StrEnum migration is a separate effort (requires Python 3.11+)
  "PLR1714",   # repeated-equality-comparison — readability preference
  "PLW2901",   # redefined-loop-name — acceptable in small scopes
  "PYI034",    # non-self-return-type — too strict for this codebase
  "RUF006",    # asyncio-dangling-task — false positive on fire-and-forget patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # assert in tests is expected
  "PLR2004",  # magic values in tests are fine
  "RUF059",   # unused unpacked vars in tests (e.g. score, breakdown = ...)
]
