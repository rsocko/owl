[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence-hub"
version = "0.2.0"
description = "Document Intelligence Hub — unified Paperless-ngx document analysis platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Ryan Sockalosky" },
]
keywords = ["document-intelligence", "paperless-ngx", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openai>=1.40.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0.0",
  "python-dateutil>=2.9.0",
  "uvicorn>=0.34.0",
  "pdfplumber>=0.11.0",
  "rapidfuzz>=3.0",
  "sqlalchemy>=2.0",
  "click>=8.0",
  "rich>=13.0",
  "apscheduler>=3.10,<4",
  "ocrmypdf>=16.0",
  "azure-ai-documentintelligence>=1.0.0",
  "pypdf>=5.0",
  "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/rsocko/owl"
Issues = "https://github.com/rsocko/owl/issues"
Repository = "https://github.com/rsocko/owl"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
dashboard = [
  "streamlit>=1.30",
]

[project.scripts]
doc-hub = "doc_intelligence_hub.modules.statements.cli:main"
doc-hub-serve = "doc_intelligence_hub.api.app:main"
eob-match = "doc_intelligence_hub.modules.eob_matching.cli:cli"
paq = "doc_intelligence_hub.modules.action_queue.cli:cli"
paperless-metadata = "doc_intelligence_hub.modules.metadata_migration.cli:cli"
ocr-quality-score = "doc_intelligence_hub.modules.ocr_quality.scoring_cli:cli"
ocr-quality = "doc_intelligence_hub.modules.ocr_quality.cli:cli"
analysis-invalidation = "doc_intelligence_hub.modules.analysis_invalidation.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doc_intelligence_hub" = [
  "modules/statements/static/*",
  "modules/statements/static/**/*",
  "api/static/*",
  "api/static/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only enforce correctness rules in CI — style/advisory rules were causing
# constant false-positive failures and a 30+ item ignore list.
select = [
  "E", "F", "W",       # pycodestyle + pyflakes (real errors)
  "I",                  # isort (import sorting, auto-fixable)
  "B",                  # flake8-bugbear (actual bug patterns)
]
ignore = [
  "E501",      # line-too-long — handled by ruff format
]
