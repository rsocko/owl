[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence-hub"
version = "0.2.0"
description = "Document Intelligence Hub — unified Paperless-ngx document analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0.0",
  "python-dateutil>=2.9.0",
  "uvicorn>=0.34.0",
  "pdfplumber>=0.11.0",
  "thefuzz[speedup]>=0.22.0",
  "sqlalchemy>=2.0",
  "click>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
dashboard = [
  "streamlit>=1.30",
]

[project.scripts]
doc-hub = "doc_intelligence_hub.modules.statements.cli:main"
doc-hub-serve = "doc_intelligence_hub.api.app:main"
eob-match = "doc_intelligence_hub.modules.eob_matching.cli:cli"
paq = "doc_intelligence_hub.modules.action_queue.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
