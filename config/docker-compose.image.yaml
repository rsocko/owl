services:
  statement-tracker:
    image: service-007.example.invalid/doc-intelligence-hub:${DOC_HUB_IMAGE_TAG:-latest}
    container_name: statement-tracker
    restart: unless-stopped
    command: ["serve", "--config", "/app/config/config.paperless.yaml"]
    environment:
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
    ports:
      - "8001:8001"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
