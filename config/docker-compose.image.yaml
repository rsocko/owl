services:
  hub:
    image: ${DOC_HUB_IMAGE:-doc-intelligence-hub:local}
    container_name: doc-intelligence-hub
    restart: unless-stopped
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_BROWSER_URL: ${PAPERLESS_BROWSER_URL:-}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      STATEMENT_TRACKER_CONFIG: /app/config/config.paperless.yaml
      DOCUMENT_VIEWS_CONFIG: ${DOCUMENT_VIEWS_CONFIG:-}
      OWL_TYRION_API_TOKEN: ${OWL_TYRION_API_TOKEN:-}
      OWL_MONARCH_DELIVERY_TYRION_AUTHORITY: ${OWL_MONARCH_DELIVERY_TYRION_AUTHORITY:-http://tyrion-operations-ui:3000}
      OWL_MONARCH_DELIVERY_IDENTITY_SECRET: ${OWL_MONARCH_DELIVERY_IDENTITY_SECRET:-}
      OWL_MONARCH_DELIVERY_WRITE_ENABLED: ${OWL_MONARCH_DELIVERY_WRITE_ENABLED:-false}
      OWL_MONARCH_DELIVERY_SENT_TAG: ${OWL_MONARCH_DELIVERY_SENT_TAG:-}
      OWL_MONARCH_DELIVERY_DEPLOYMENT_ID: ${OWL_MONARCH_DELIVERY_DEPLOYMENT_ID:-default}
    ports:
      - "8001:8001"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
