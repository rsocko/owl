[project]
name = "paperless-action-queue"
version = "0.1.0"
description = "Extract actionable insights from Paperless-NGX documents using AI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.30",
    "python-dateutil>=2.8",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
paq = "src.cli:cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
