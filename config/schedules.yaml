# Document Intelligence Hub — Schedule Definitions
# =================================================
# Central configuration for all scheduled jobs.
# These defaults are compiled into the built-in scheduler
# (src/doc_intelligence_hub/core/scheduler.py) and can be
# overridden at runtime via PUT /api/admin/schedules.
#
# Also referenced by config/crontab.example for fallback.
#
# Each module defines its schedule(s) with:
#   cron     — Standard 5-field cron expression
#   endpoint — Hub API endpoint to call
#   method   — HTTP method (default: POST)
#   body     — Optional JSON request body
#   limit    — Max items to process per run
#   enabled  — Whether the schedule is active
#   timeout  — Max execution time in seconds

statement_tracker:
  discovery:
    description: "Discover new recurring statements from Paperless documents"
    cron: "0 9 * * *"          # Daily at 9:00 AM
    endpoint: "/api/statements/discovery/run"
    method: POST
    enabled: true
    timeout: 120

  gap_check:
    description: "Detect missing/late statements and generate recommendations"
    cron: "30 9 * * *"         # Daily at 9:30 AM
    endpoint: "/api/statements/recommendations/run"
    method: POST
    # Note: requires ?as_of=YYYY-MM-DD query parameter (today's date)
    enabled: true
    timeout: 120

eob_matching:
  run:
    description: "Classify and match EOBs to medical bills (incremental)"
    cron: "0 10 * * *"         # Daily at 10:00 AM (was weekly; --since-last-run makes daily efficient)
    endpoint: "/api/eob/run"
    method: POST
    body:
      limit: 200
      tags: ["medical"]
      since_last_run: true
    limit: 200
    enabled: true
    timeout: 300

  benchmark:
    description: "Benchmark LLM models for EOB extraction quality and detect regressions"
    cron: "0 6 * * 1"          # Weekly on Monday at 6:00 AM
    endpoint: "/api/eob/benchmark"
    method: POST
    body:
      models: ["phi3:mini", "gpt-4o-mini", "gpt-4o"]
      limit: 5
      trigger: "scheduled"
    enabled: true
    timeout: 600

action_queue:
  run:
    description: "Triage inbox documents and create action items"
    cron: "0 8,14 * * *"       # Daily at 8:00 AM and 2:00 PM
    endpoint: "/api/queue/run"
    method: POST
    body:
      dry_run: false
      limit: 50
    limit: 50
    enabled: true
    timeout: 180

# ── Analysis Engine ──────────────────────────────────────────────

analysis:
  daily:
    description: "Run daily analysis rules: orphan detection, bill aging, threshold checks"
    cron: "0 2 * * *"          # Daily at 2:00 AM
    endpoint: "/api/analysis/execute/scheduled/daily"
    method: POST
    enabled: true
    timeout: 300

  weekly:
    description: "Run weekly analysis rules: LLM coverage analysis, n8n cross-reference"
    cron: "0 3 * * 0"          # Weekly on Sunday at 3:00 AM
    endpoint: "/api/analysis/execute/scheduled/weekly"
    method: POST
    enabled: true
    timeout: 600

  monthly:
    description: "Run monthly analysis rules: spend comparison, match rate reporting"
    cron: "0 4 1 * *"          # 1st of month at 4:00 AM
    endpoint: "/api/analysis/execute/scheduled/monthly"
    method: POST
    enabled: true
    timeout: 600
